name: Deploy to GitHub Pages

# One Pages site per repository: main is served at the root and develop
# under /develop/, so a push to either branch rebuilds both.
on:
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: main
      - uses: actions/checkout@v4
        with:
          ref: develop
          path: develop
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: '*/package-lock.json'
      - name: Build main
        working-directory: main
        run: |
          npm ci
          npm run typecheck
          npm test
          npx vite build --base=/${{ github.event.repository.name }}/
      - name: Build develop
        working-directory: develop
        # Its own storage names, for the build only: develop keeps its own history and preferences.
        run: |
          npm ci
          npm run typecheck
          npm test
          VITE_STORAGE_NAME=dart-counter-develop npx vite build --base=/${{ github.event.repository.name }}/develop/
      - run: cp -r develop/dist main/dist/develop
      - uses: actions/upload-pages-artifact@v3
        with:
          path: main/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
