name: Checks

# The prek hooks of .pre-commit-config.yaml (formatting, typecheck, tests) on
# every push and pull request, plus the commit message check on new commits.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  prek:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: pipx install prek==0.5.3
      - run: prek run --all-files --show-diff-on-failure

      - name: Check commit messages
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            range="$PR_BASE..$PR_HEAD"
          elif [ -z "$BEFORE" ] || [ "$BEFORE" = 0000000000000000000000000000000000000000 ]; then
            # A new branch: the commits that main does not have yet.
            range="origin/main..HEAD"
          else
            range="$BEFORE..HEAD"
          fi
          status=0
          for commit in $(git rev-list --no-merges "$range"); do
            git log -1 --format=%B "$commit" > "$RUNNER_TEMP/msg"
            scripts/check-commit-msg.sh "$RUNNER_TEMP/msg" || status=1
          done
          exit $status
